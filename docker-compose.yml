services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aspan
      POSTGRES_USER: aspan
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
